name: Publish Dev Alpha

on:
  push:
    branches:
      - dev

permissions:
  contents: read

jobs:
  publish-dev:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout git repo
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          java-version: 26
          distribution: 'temurin'

      - name: Resolve alpha version for dev builds
        id: version
        env:
          MODRINTH_PROJECT_ID: ${{ secrets.MODRINTH_PROJECT_ID }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          import sys
          import urllib.request

          def read_maven_version():
              return subprocess.check_output(
                  ["mvn", "help:evaluate", "-Dexpression=project.version", "-q", "-DforceStdout"],
                  text=True,
              ).strip()

          base = read_maven_version()
          version = None
          canonical_repo = os.environ.get("GITHUB_REPOSITORY").lower() == "justindevb/betterreplay"
          modrinth_project_id = os.environ.get("MODRINTH_PROJECT_ID", "").strip()

          if canonical_repo and modrinth_project_id:
              with urllib.request.urlopen(
                  f"https://api.modrinth.com/v2/project/{modrinth_project_id}/version"
              ) as response:
                  published_versions = json.load(response)

              published_numbers = [entry.get("version_number", "") for entry in published_versions]
              if base in published_numbers:
                  print(
                      f"Stable version {base} is already published. Bump pom.xml to the next development version before publishing more dev alphas.",
                      file=sys.stderr,
                  )
                  sys.exit(1)

              alpha_pattern = re.compile(rf"^{re.escape(base)}-alpha\.(\d+)$")
              highest_alpha = 0
              for published_number in published_numbers:
                  match = alpha_pattern.match(published_number)
                  if match:
                      highest_alpha = max(highest_alpha, int(match.group(1)))

              version = f"{base}-alpha.{highest_alpha + 1}"
          else:
              version = f"{base}-alpha.{os.environ['GITHUB_RUN_NUMBER']}"

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"VERSION={version}\n")
          PY

      - name: Set alpha version for dev builds
        run: |
          mvn versions:set -DnewVersion="${{ steps.version.outputs.VERSION }}" -DgenerateBackupPoms=false

      - name: Build
        run: mvn install

      - name: Resolve Modrinth changelog
        id: modrinth_changelog
        run: |
          python3 - <<'PY'
          import os
          import re
          import sys
          from pathlib import Path

          changelog_path = Path("CHANGELOG.md")
          text = changelog_path.read_text(encoding="utf-8")
          matches = list(re.finditer(r'^## \[(.+?)\](?: - .*)?$', text, re.MULTILINE))

          sections = {}
          for index, match in enumerate(matches):
              start = match.end()
              end = matches[index + 1].start() if index + 1 < len(matches) else len(text)
              sections[match.group(1)] = text[start:end].strip()

          body = sections.get("Unreleased")

          if not body:
              print(f"Unable to find changelog section [Unreleased] in {changelog_path}.", file=sys.stderr)
              sys.exit(1)

          output_path = Path(os.environ["GITHUB_OUTPUT"])
          with output_path.open("a", encoding="utf-8") as output:
              output.write("CHANGELOG<<EOF\n")
              output.write(f"## [Unreleased]\n\n{body}\n")
              output.write("EOF\n")
          PY

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: BetterReplay-dev
          path: target/*.jar

      - name: Publish to Modrinth
        if: github.repository == 'justindevb/BetterReplay'
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ secrets.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-changelog: ${{ steps.modrinth_changelog.outputs.CHANGELOG }}
          files: target/BetterReplay-*.jar
          version: ${{ steps.version.outputs.VERSION }}
          version-type: alpha
          loaders: |
            paper
            purpur
            folia
            spigot
            bukkit
          game-versions: |
            1.21
            1.21.1
            1.21.2
            1.21.3
            1.21.4
            1.21.5
            1.21.6
            1.21.7
            1.21.8
            1.21.9
            1.21.10
            1.21.11
            26.1.1
            26.1.2
          dependencies: |
            packetevents(required)